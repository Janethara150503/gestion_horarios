<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar cambio - Sistema de Horarios</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="manifest" href="../manifest.json">
</head>
<body>
    <div id="layout-contenedor"></div>

    <div class="contenedor" style="max-width: 600px;">
        <h2 style="margin: 20px 0;">Solicitar cambio de horario</h2>
        <div id="mensaje"></div>
        <div class="tarjeta">
            <form id="form-solicitud" class="formulario">
                <label for="horario_clase_id">Selecciona tu clase</label>
                <select id="horario_clase_id" name="horario_clase_id" required>
                    <option value="">Cargando tus clases...</option>
                </select>

                <label for="fecha_afectada">Fecha afectada</label>
                <input type="date" id="fecha_afectada" name="fecha_afectada" required>

                <label for="motivo">Motivo del cambio</label>
                <textarea id="motivo" name="motivo" rows="4" required placeholder="Explica brevemente por que necesitas el cambio"></textarea>

                <button type="submit" class="boton">Enviar solicitud</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const DIAS_ORDEN = ["lunes", "martes", "miercoles", "jueves", "viernes", "sabado", "domingo"];
        let usuarioActual = null;

        async function iniciar() {
            usuarioActual = await protegerPagina(["docente"]);
            if (!usuarioActual) return;

            renderizarLayout(usuarioActual, "docente-solicitar.html");
            iniciarPolling();

            await cargarMisClases();

            document.getElementById("form-solicitud").addEventListener("submit", enviarSolicitud);
        }

        async function cargarMisClases() {
            const selector = document.getElementById("horario_clase_id");
            const divMensaje = document.getElementById("mensaje");

            try {
                const todosLosHorarios = await api.listarHorarios();
                const misClases = todosLosHorarios.filter((h) => h.docente.usuario_id === usuarioActual.id);

                if (misClases.length === 0) {
                    selector.innerHTML = '<option value="">No tienes clases asignadas</option>';
                    return;
                }

                selector.innerHTML = misClases
                    .map((h) => {
                        const etiqueta = `${capitalizar(h.dia_semana)} ${h.hora_inicio}-${h.hora_fin} | ${h.materia.nombre} | ${h.grupo.nombre}`;
                        return `<option value="${h.id}">${etiqueta}</option>`;
                    })
                    .join("");
            } catch (error) {
                divMensaje.innerHTML = `<div class="mensaje mensaje-error">${error.message}</div>`;
            }
        }

        async function enviarSolicitud(evento) {
            evento.preventDefault();
            const divMensaje = document.getElementById("mensaje");
            divMensaje.innerHTML = "";

            const datos = {
                horario_clase_id: parseInt(document.getElementById("horario_clase_id").value),
                fecha_afectada: document.getElementById("fecha_afectada").value,
                motivo: document.getElementById("motivo").value,
            };

            try {
                await api.crearSolicitud(datos);
                divMensaje.innerHTML = '<div class="mensaje mensaje-exito">Solicitud enviada correctamente. El coordinador la revisara pronto.</div>';
                document.getElementById("form-solicitud").reset();
            } catch (error) {
                divMensaje.innerHTML = `<div class="mensaje mensaje-error">${error.message}</div>`;
            }
        }

        function capitalizar(texto) {
            return texto.charAt(0).toUpperCase() + texto.slice(1);
        }

        iniciar();
    </script>
</body>
</html>
