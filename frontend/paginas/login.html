<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - Sistema de Horarios</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="manifest" href="../manifest.json">
</head>
<body>
    <div class="contenedor" style="max-width: 400px; margin-top: 80px;">
        <div class="tarjeta">
            <h2 style="margin-bottom: 20px;">Iniciar sesion</h2>
            <div id="mensaje-error"></div>
            <form id="form-login" class="formulario">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required>

                <label for="password">Contrasena</label>
                <input type="password" id="password" name="password" required>

                <button type="submit" class="boton" style="width: 100%;">Ingresar</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const formulario = document.getElementById("form-login");
        const divMensaje = document.getElementById("mensaje-error");

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();
            divMensaje.innerHTML = "";

            const correo = document.getElementById("correo").value;
            const password = document.getElementById("password").value;

            try {
                await iniciarSesion(correo, password);
                const usuario = await obtenerUsuarioActual();

                const destinosPorRol = {
    admin: "admin-usuarios.html",
    coordinador: "coordinador-academico.html",
    docente: "docente-horario.html",
    estudiante: "estudiante-horario.html",
    personal_admin: "buscador-horarios.html",
};

                window.location.href = destinosPorRol[usuario.rol.nombre] || "../paginas/login.html";
            } catch (error) {
                divMensaje.innerHTML = `<div class="mensaje mensaje-error">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
