<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuracion general - Sistema de Horarios</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="manifest" href="../manifest.json">
</head>
<body>
    <div id="layout-contenedor"></div>

    <div class="contenedor" style="max-width: 600px;">
        <h2 style="margin: 20px 0;">Configuracion general</h2>
        <div id="mensaje"></div>

        <div class="tarjeta">
            <h3 style="margin-bottom: 12px;">Logo de la institucion</h3>
            <div id="logo-actual" style="margin-bottom: 12px;"></div>
            <input type="file" id="c-logo-archivo" accept=".png,.jpg,.jpeg,.gif,.webp">
            <button type="button" class="boton" id="btn-subir-logo">Subir logo</button>
        </div>

        <div class="tarjeta">
            <form id="form-configuracion" class="formulario">
                <label for="c-nombre">Nombre de la institucion</label>
                <input type="text" id="c-nombre" required>

                <label for="c-direccion">Direccion</label>
                <input type="text" id="c-direccion">

                <label for="c-contacto">Contacto</label>
                <input type="text" id="c-contacto" placeholder="Telefono o correo">

                <label>Dias de operacion</label>
                <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px;">
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;">
                        <input type="checkbox" value="lunes" class="dia-check" style="width: auto;"> Lunes
                    </label>
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;">
                        <input type="checkbox" value="martes" class="dia-check" style="width: auto;"> Martes
                    </label>
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;">
                        <input type="checkbox" value="miercoles" class="dia-check" style="width: auto;"> Miercoles
                    </label>
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;">
                        <input type="checkbox" value="jueves" class="dia-check" style="width: auto;"> Jueves
                    </label>
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;">
                        <input type="checkbox" value="viernes" class="dia-check" style="width: auto;"> Viernes
                    </label>
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;">
                        <input type="checkbox" value="sabado" class="dia-check" style="width: auto;"> Sabado
                    </label>
                    <label style="display: flex; align-items: center; gap: 4px; font-weight: normal;">
                        <input type="checkbox" value="domingo" class="dia-check" style="width: auto;"> Domingo
                    </label>
                </div>

                <label for="c-duracion" style="margin-top: 16px;">Duracion de sesion (minutos)</label>
                <input type="number" id="c-duracion" required min="5">
                <p style="color: var(--color-texto-claro); font-size: 0.8rem; margin-top: 4px;">
                    Nota: este valor se guarda como referencia. Para que tenga efecto real en el sistema, el backend debe reiniciarse con el nuevo valor.
                </p>

                <button type="submit" class="boton">Guardar configuracion</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        const API_ORIGEN_PAGINA = "http://127.0.0.1:8000";

        async function iniciar() {
            const usuario = await protegerPagina(["admin"]);
            if (!usuario) return;

            await renderizarLayout(usuario, "admin-configuracion.html");
            iniciarPolling();

            await cargarConfiguracion();

            document.getElementById("form-configuracion").addEventListener("submit", guardarConfiguracion);
            document.getElementById("btn-subir-logo").addEventListener("click", subirLogo);
        }

        function mostrarError(mensaje) {
            document.getElementById("mensaje").innerHTML = `<div class="mensaje mensaje-error">${mensaje}</div>`;
        }

        function mostrarExito(mensaje) {
            document.getElementById("mensaje").innerHTML = `<div class="mensaje mensaje-exito">${mensaje}</div>`;
        }

        function mostrarLogoActual(logoUrl) {
            const contenedor = document.getElementById("logo-actual");
            if (logoUrl) {
                contenedor.innerHTML = `<img src="${API_ORIGEN_PAGINA}${logoUrl}" alt="Logo actual" style="max-height: 80px; border-radius: 6px; border: 1px solid var(--color-borde);">`;
            } else {
                contenedor.innerHTML = '<p style="color: var(--color-texto-claro); font-size: 0.9rem;">Aun no se ha subido un logo.</p>';
            }
        }

        async function cargarConfiguracion() {
            try {
                const config = await api.obtenerConfiguracion();

                document.getElementById("c-nombre").value = config.nombre_institucion;
                document.getElementById("c-direccion").value = config.direccion || "";
                document.getElementById("c-contacto").value = config.contacto || "";
                document.getElementById("c-duracion").value = config.duracion_sesion_minutos;

                mostrarLogoActual(config.logo_url);

                const diasActivos = config.dias_operacion.split(",");
                document.querySelectorAll(".dia-check").forEach((check) => {
                    check.checked = diasActivos.includes(check.value);
                });
            } catch (error) {
                mostrarError(error.message);
            }
        }

        async function subirLogo() {
            const input = document.getElementById("c-logo-archivo");
            if (!input.files || input.files.length === 0) {
                mostrarError("Selecciona un archivo de imagen primero");
                return;
            }

            try {
                const config = await api.subirLogo(input.files[0]);
                mostrarExito("Logo subido correctamente");
                mostrarLogoActual(config.logo_url);
                input.value = "";
            } catch (error) {
                mostrarError(error.message);
            }
        }

        async function guardarConfiguracion(evento) {
            evento.preventDefault();

            const diasSeleccionados = Array.from(document.querySelectorAll(".dia-check:checked")).map((c) => c.value);

            const datos = {
                nombre_institucion: document.getElementById("c-nombre").value,
                direccion: document.getElementById("c-direccion").value || null,
                contacto: document.getElementById("c-contacto").value || null,
                dias_operacion: diasSeleccionados.join(","),
                duracion_sesion_minutos: parseInt(document.getElementById("c-duracion").value),
            };

            try {
                await api.actualizarConfiguracion(datos);
                mostrarExito("Configuracion guardada correctamente");
            } catch (error) {
                mostrarError(error.message);
            }
        }

        iniciar();
    </script>
</body>
</html>
